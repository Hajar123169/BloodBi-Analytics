spring.application.name=bloodbi-analytics-backend
server.port=8082

# =====================================================
# BASE DE DONNÉES PRINCIPALE (Docker - MySQL Service)
# =====================================================
spring.datasource.url=jdbc:mysql://mysql:3306/bloodbi_v2?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpassword

# =====================================================
# DATA WAREHOUSE (Docker - MySQL Service)
# =====================================================
bloodbi.dw.url=jdbc:mysql://mysql:3306/bloodbi_dw_v2?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
bloodbi.dw.username=root
bloodbi.dw.password=rootpassword

# =====================================================
# HIBERNATE CONFIGURATION
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =====================================================
# DATABASE INITIALIZATION
# =====================================================
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# =====================================================
# CORS - FRONTEND & MOBILE
# =====================================================
bloodbi.cors.allowed-origins=http://localhost:3000,http://frontend:3000,http://127.0.0.1:3000

# =====================================================
# LOGGING
# =====================================================
logging.level.root=INFO
logging.level.com.bloodbi=DEBUG

# =====================================================
# ACTUATOR HEALTH CHECK
# =====================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
