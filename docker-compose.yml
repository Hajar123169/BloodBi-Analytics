version: '3.9'

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: bloodbi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bloodbi_v2
      MYSQL_ROOT_HOST: '%'
      MYSQL_INITDB_SKIP_TZINFO: 1
    ports:
      - "3307:3306"
    volumes:
      # Database initialization scripts
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/data_warehouse_schema.sql:/docker-entrypoint-initdb.d/02-data_warehouse_schema.sql
      - ./database/etl_views.sql:/docker-entrypoint-initdb.d/03-etl_views.sql
      # Persistent data
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - bloodbi-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Spring Boot Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bloodbi-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bloodbi_v2?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      BLOODBI_DW_URL: jdbc:mysql://mysql:3306/bloodbi_dw_v2?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      BLOODBI_DW_USERNAME: root
      BLOODBI_DW_PASSWORD: rootpassword
      SERVER_PORT: 8082
      BLOODBI_CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://frontend:3000,http://127.0.0.1:3000"
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/src/main/resources:/app/config:ro
    networks:
      - bloodbi-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bloodbi-frontend
    environment:
      REACT_APP_API_URL: http://localhost:8082
      REACT_APP_API_BASE_PATH: /api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - bloodbi-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  bloodbi-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
