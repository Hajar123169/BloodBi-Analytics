spring.application.name=${APP_NAME:bloodbi-analytics-backend}
server.port=${SERVER_PORT:8082}

# =====================================================
# BASE DE DONNÉES PRINCIPALE
# =====================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bloodbi_v2?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# =====================================================
# DATA WAREHOUSE
# =====================================================
bloodbi.dw.url=${DW_DB_URL:jdbc:mysql://localhost:3306/bloodbi_dw_v2?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
bloodbi.dw.username=${DW_DB_USERNAME:root}
bloodbi.dw.password=${DW_DB_PASSWORD:}

# =====================================================
# HIBERNATE CONFIGURATION
# =====================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =====================================================
# INITIALISATION DE LA BASE
# =====================================================
spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.jpa.defer-datasource-initialization=true

# =====================================================
# CORS - FRONTEND & MOBILE
# =====================================================
bloodbi.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}