spring.application.name=bloodbi-analytics-backend
server.port=8081

# =====================================================
# BASE DE DONNÉES PRINCIPALE (V2 - DATASET ENRICHI)
# =====================================================
spring.datasource.url=jdbc:mysql://localhost:3306/bloodbi_v2?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# =====================================================
# DATA WAREHOUSE (V2)
# =====================================================
bloodbi.dw.url=jdbc:mysql://localhost:3306/bloodbi_dw_v2?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
bloodbi.dw.username=root
bloodbi.dw.password=

# =====================================================
# HIBERNATE CONFIGURATION
# =====================================================
# Important: mettre update pour conserver les données
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =====================================================
# INITIALISATION DE LA BASE (désactivée car on importe manuellement)
# =====================================================
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# =====================================================
# CORS - FRONTEND & MOBILE
# =====================================================
bloodbi.cors.allowed-origins=http://localhost:3000,http://localhost:19006,http://127.0.0.1:3000